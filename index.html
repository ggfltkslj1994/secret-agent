<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Amigo Secreto</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .enter {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: min(290px, 85vw);
      min-height: 150px;
      padding: 28px 42px;
      border: 0;
      border-radius: 4px;
      background: #fff;
      color: #000;
      text-decoration: none;
      text-align: center;
      transition: transform .15s ease, background .15s ease;
    }
    .enter:hover { background: #ededed; transform: translateY(-2px); }
    .enter:active { transform: scale(.98); }
    .title {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: .01em;
    }
    .action {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .enter:focus-visible { outline: 3px solid #aaa; outline-offset: 6px; }
  </style>
</head>
<body>
  <a class="enter"
     href="https://view.genially.com/6afaeb38eadf883f5ded4e97"
     target="_self"
     aria-label="Entrar no Amigo Secreto">
    <span class="title">Amigo Secreto</span>
    <span class="action">ENTRAR</span>
  </a>
</body>
</html>

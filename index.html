<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131c">
  <title>Secret Agent — Entrar no jogo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #10131c; color: #fff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { min-height: 100svh; display: grid; place-items: center; }
    #entry { min-height: 100svh; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; padding: 28px; text-align: center; background: radial-gradient(ellipse at center, #293044 0%, #10131c 70%); }
    .tag { letter-spacing: .22em; font-size: .75rem; color: #c5a86a; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(2.4rem, 10vw, 5rem); line-height: .95; letter-spacing: .06em; }
    p { margin: 0; color: #d2d5dc; max-width: 34rem; line-height: 1.5; }
    button { border: 0; border-radius: 6px; padding: 18px 30px; min-width: 230px; background: #c5a86a; color: #141414; font-weight: 900; font-size: 1.05rem; letter-spacing: .08em; cursor: pointer; box-shadow: 0 8px 28px #0008; }
    button:active { transform: scale(.98); }
    #game { display: none; width: 100%; height: 100svh; }
    #game iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
    #fallback { display:none; position: fixed; z-index: 5; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); padding: 12px; border-radius: 8px; background: #242a38ee; text-align: center; font-size: .85rem; }
    #fallback a { color: #f3d28d; }
    :fullscreen { background: #000; }
  </style>
</head>
<body>
  <main id="entry">
    <div class="tag">MISSÃO CLASSIFICADA</div>
    <h1>SECRET<br>AGENT</h1>
    <p>Estás pronto para começar? Carrega no botão para entrar no jogo.</p>
    <button id="start" type="button">ENTRAR NO JOGO</button>
    <p style="font-size:.78rem;color:#9da4b3">Para a melhor experiência, ativa o som.</p>
  </main>
  <main id="game" aria-label="Jogo Secret Agent">
    <iframe id="genially"
      src="https://view.genially.com/6afaeb38eadf883f5ded4e97"
      title="Secret Agent — Genially"
      allow="fullscreen; autoplay; clipboard-read; clipboard-write"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <div id="fallback">Se o ecrã inteiro não for ativado automaticamente, usa os controlos do Genially ou <a href="https://view.genially.com/6afaeb38eadf883f5ded4e97" target="_blank" rel="noopener">abre o jogo numa nova janela</a>.</div>
  <script>
    const start = document.getElementById('start');
    const entry = document.getElementById('entry');
    const game = document.getElementById('game');
    const frame = document.getElementById('genially');
    const fallback = document.getElementById('fallback');

    start.addEventListener('click', async () => {
      entry.style.display = 'none';
      game.style.display = 'block';
      fallback.style.display = 'block';
      try {
        if (frame.requestFullscreen) {
          await frame.requestFullscreen();
        } else if (frame.webkitRequestFullscreen) {
          frame.webkitRequestFullscreen();
        } else {
          // iPhone Safari may not allow fullscreen for an embedded webpage.
          fallback.style.display = 'block';
        }
      } catch (e) {
        fallback.style.display = 'block';
      }
    });
  </script>
</body>
</html>
